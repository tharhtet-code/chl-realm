    title: "The Honest Checkout & Community Trust"
    core_value: "Integrity"
    lms_hook: "module_core_values_2026"
    world: "Retail_Realm"
    npc_assigner: "Coach_Ohnmar"
    spawn_location: [210, 440]
    puzzle_object: "POS Integrity Terminal #4"
    dialogue:
      greeting: "Welcome to CMHL in Yangon! To serve our community, we must act with Integrity. Can you solve this scenario?"
      completion: "Outstanding! You upheld CMHL Integrity. Wear your Purple CMHL Tabard with pride!"
    challenge_type: "scenario_quiz"
    questions:
      - prompt: "A customer accidentally leaves a paid luxury gift basket at the express checkout counter in Yangon City Mall. No one else is nearby. What is the right action?"
        options:
          - "Log it immediately in the Lost & Found register, secure it at Customer Service, and alert the floor lead"
          - "Leave it at the end of the counter until closing time"
          - "Return the items to the aisle shelves without logging the receipt"
          - "Move it to the staff locker room without telling anyone"
        correct_index: 0
        explanation: "Integrity means acting honestly and transparently even when nobody is watching."
      - prompt: "A promotional shelf tag for fresh milk expired last night, showing 10% off, while the POS scans regular price. How do you respond?"
        options:
          - "Apologize warmly, honor the displayed policy transparently, and alert the aisle coordinator to update the tag immediately"
          - "Tell the shopper the register price is final and cannot be questioned"
          - "Ask the shopper to come back next week"
          - "Ignore the customer and scan the next item"
        correct_index: 0
        explanation: "Honoring commitments and fixing root causes builds lifelong community trust."
      - prompt: "During morning stock rotation in the produce plaza, you spot a crate of strawberries with moisture damage. What should you do?"
        options:
          - "Remove the damaged crate from the sales floor and record it accurately in the quality variance log"
          - "Hide the bruised berries at the bottom of the display"
          - "Relabel the expiration date by two days"
          - "Sell them at full price without inspection"
        correct_index: 0
        explanation: "Quality integrity protects every family shopping at City Mart Holding Co., Ltd."
    rewards:
      xp: 200
      coins: 90
      badge: "Integrity_Seed"
      item_unlock: "Purple_CMHL_Apron"
      unlocks_travel_pass: true

